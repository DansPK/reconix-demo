services:
  harness:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      HARNESS_DATA_DIR: /data
      HARNESS_TOKENS_FILE: /data/tokens.json
      # Scanning is delegated to the Kali MCP container (see deploy/README.md). Both run on this
      # host: the harness reaches the container's /mcp endpoint and its bundled SonarQube (H2)
      # through host.docker.internal, and they share the code through the reconix-code volume.
      KALI_MCP_URL: ${KALI_MCP_URL-http://host.docker.internal:8090/mcp}
      KALI_MCP_AUTH_TOKEN: ${KALI_MCP_AUTH_TOKEN}
      KALI_WORKSPACE_MAP: ${KALI_WORKSPACE_MAP-/data=/workspace}
      SONAR_HOST_URL: ${SONAR_HOST_URL-http://host.docker.internal:9000}
      # The agents' web search; set WEB_SEARCH_URL= (empty) in .env to turn it off.
      WEB_SEARCH_URL: ${WEB_SEARCH_URL-http://searxng:8080}
    volumes:
      # Shared with the Kali container (mounted there read-only at /workspace) so it can scan the
      # code the harness unpacks — no files cross the MCP connection. Create it once:
      #   docker volume create reconix-code
      - reconix-code:/data
      # TLS certificate and key, if HARNESS_TLS_CERT/HARNESS_TLS_KEY point here (scripts/make_dev_cert.sh)
      - ./certs:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run setup.sh or set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  # Code volume shared with the Kali MCP container. External so both compose projects use the same
  # one; create it with `docker volume create reconix-code`.
  reconix-code:
    external: true
