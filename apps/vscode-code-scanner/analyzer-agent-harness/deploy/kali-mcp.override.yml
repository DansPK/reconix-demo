# Compose override for the reconix-kali-container, owned by the harness repo so the Kali repo
# stays untouched. Run the Kali container together with its bundled SonarQube (H2) like this,
# from the reconix-kali-container directory:
#
#   docker volume create reconix-code
#   docker compose -f docker-compose.yml \
#     -f /path/to/analyzer-agent-harness/deploy/kali-mcp.override.yml \
#     --profile sonar up -d --build
#
# It exposes the MCP endpoint on host port 8090 and mounts the shared code volume read-only at
# /workspace. Set KALI_MCP_AUTH_TOKEN and SONAR_TOKEN in the environment (same token the harness
# .env uses). See deploy/README.md.
services:
  kali-mcp:
    environment:
      KALI_MCP_TRANSPORT: http
      KALI_MCP_HOST: 0.0.0.0
      KALI_MCP_PORT: "8090"
      KALI_MCP_AUTH_TOKEN: ${KALI_MCP_AUTH_TOKEN:?set KALI_MCP_AUTH_TOKEN}
      # The Kali container reaches its sibling SonarQube over the compose network.
      SONAR_HOST_URL: ${SONAR_HOST_URL-http://sonarqube:9000}
      # Empty on first bring-up; set it after bootstrapping SonarQube, then restart kali-mcp.
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    ports:
      - "${KALI_MCP_PORT:-8090}:8090"
    volumes:
      - reconix-code:/workspace:ro

volumes:
  reconix-code:
    external: true
