services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgres://shop:shop@db:5432/shop
      JWT_SECRET: secret
    ports:
      # host:container — change left side to 8081 to expose to the Kali VM subnet
      - "8081:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
