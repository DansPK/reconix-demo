[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "A TUI security-testing harness that executes Kali tools via an MCP server and analyzes findings with a local LLM. For authorized, controlled penetration testing only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "mcp>=1.2",
    "litellm>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
harness = "harness.app:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
